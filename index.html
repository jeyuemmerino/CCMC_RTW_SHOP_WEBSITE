<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CCMC RTW Shop — Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="login-split">
    <section class="login-visual">
      <div>
        <span class="brand-badge">Imus, Cavite • Sportswear &amp; RTW</span>
        <h1>CCMC RTW Shop</h1>
      </div>

    </section>

    <section class="login-panel">
      <div class="login-card">
        <h2>Welcome Back</h2>
        <p class="subtitle">Sign in with your authorized owner or staff account.</p>

        <div id="login-error" class="alert-box alert-error hidden"></div>

        <form id="login-form">
          <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Enter username" required autocomplete="username" />
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter password" required autocomplete="current-password" />
          </div>

          <button type="submit" class="btn btn-primary w-full">Sign In to System</button>
        </form>
      </div>
    </section>
  </div>

  <script src="js/store.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
